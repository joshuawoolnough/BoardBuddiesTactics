<body>
<canvas id="c" tabindex="0"></canvas>
<div id="hint">Click the game once so your browser allows sound. ARROWS/WASD move &middot; Z/ENTER confirm &middot; X cancel &middot; ESC menu &middot; SHIFT run &middot; M mute</div>
<script>

// ---- p1_core.js ----
'use strict';
// ===================== CORE: canvas, input, font, drawing, audio, save =====================
const W=400,H=240;
const cv=document.getElementById('c'); cv.width=W; cv.height=H;
const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
function fit(){const s=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H)));cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();

const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t;

// ---------- INPUT ----------
const keys={},pressed={};
function codeOf(e){
  if(e.code)return e.code;const k=e.key||'';
  if(k===' ')return 'Space';if(k==='Shift')return 'ShiftLeft';if(k.length===1&&/[a-z]/i.test(k))return 'Key'+k.toUpperCase();return k;
}
addEventListener('keydown',e=>{
  const c=codeOf(e);if(!keys[c])pressed[c]=true;keys[c]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Backspace','Tab'].includes(c))e.preventDefault();
  AudioSys.resume();
});
addEventListener('keyup',e=>{keys[codeOf(e)]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const Input={
  rep:{},
  up:()=>!!(keys.ArrowUp||keys.KeyW),down:()=>!!(keys.ArrowDown||keys.KeyS),
  left:()=>!!(keys.ArrowLeft||keys.KeyA),right:()=>!!(keys.ArrowRight||keys.KeyD),
  run:()=>!!(keys.ShiftLeft||keys.ShiftRight),
  confirmP:()=>!!(pressed.KeyZ||pressed.Enter||pressed.Space||pressed.KeyJ),
  cancelP:()=>!!(pressed.KeyX||pressed.Backspace||pressed.KeyK),
  escP:()=>!!pressed.Escape,
  menuP:()=>!!(pressed.Escape||pressed.KeyI),
  muteP:()=>!!pressed.KeyM,
  anyP:()=>Object.keys(pressed).some(k=>pressed[k]),
  // directional press with hold-repeat for menus
  nav(dir){
    const held=this[dir]();
    if(!held){this.rep[dir]=0;return false;}
    this.rep[dir]=(this.rep[dir]||0)+1;
    const r=this.rep[dir];
    return r===1||(r>14&&(r-14)%5===0);
  },
  flush(){for(const k in pressed)pressed[k]=false;}
};

// ---------- FONT (3x5 bitmap) ----------
const FONT_DATA={
A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",
G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",
M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101110011",R:"110101110101101",
S:"011100010001110",T:"111010010010010",U:"101101101101011",V:"101101101101010",W:"101101111111101",X:"101101010101101",
Y:"101101010010010",Z:"111001010100111",
"0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"111001011001111","4":"101101111001001","5":"111100110001110",
"6":"011100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001110",
" ":"000000000000000","!":"010010010000010","?":"110001010000010",".":"000000000000010",",":"000000000010100","'":"010010000000000",
'"':"101101000000000","-":"000000111000000","+":"000010111010000",":":"000010000010000",";":"000010000010100","/":"001001010100100",
"(":"010100100100010",")":"010001001001010","=":"000111000111000","%":"101001010100101","*":"101010111010101","<":"001010100010001",
">":"100010001010100","[":"110100100100110","]":"011001001001011","_":"000000000000111","~":"000011110000000","&":"010101010101011",
"#":"101111101111101","@":"101111111010000","}":"100110111110100","{":"010111111111010","^":"010111010010010","|":"010010010010010",
"$":"010111100111010"
};
const fontCache={};
function glyphCanvas(ch,color,scale){
  const key=ch+color+scale;if(fontCache[key])return fontCache[key];
  const d=FONT_DATA[ch]||FONT_DATA['?'];
  const c=document.createElement('canvas');c.width=3*scale;c.height=5*scale;const g=c.getContext('2d');g.fillStyle=color;
  for(let i=0;i<15;i++)if(d[i]==='1')g.fillRect((i%3)*scale,Math.floor(i/3)*scale,scale,scale);
  fontCache[key]=c;return c;
}
function text(str,x,y,color='#fff',scale=2,shadow=null){
  str=String(str).toUpperCase();let cx=x;
  for(const ch of str){
    if(ch==='\n'){cx=x;y+=7*scale;continue;}
    if(ch!==' '){
      if(shadow)ctx.drawImage(glyphCanvas(ch,shadow,scale),cx+scale,y+scale);
      ctx.drawImage(glyphCanvas(ch,color,scale),cx,y);
    }
    cx+=4*scale;
  }
  return cx;
}
const textW=(s,scale=2)=>String(s).length*4*scale-scale;
function textC(str,cx,y,color,scale=2,shadow){text(str,Math.round(cx-textW(str,scale)/2),y,color,scale,shadow);}
function textR(str,rx,y,color,scale=2,shadow){text(str,Math.round(rx-textW(str,scale)),y,color,scale,shadow);}
function wrap(str,maxChars){
  const out=[];for(const para of String(str).split('\n')){let line='';for(const w of para.split(' ')){
    if((line+' '+w).trim().length>maxChars){out.push(line.trim());line=w;}else line=(line+' '+w);}
    out.push(line.trim());}
  return out;
}

// ---------- DRAWING ----------
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function frame(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,1);ctx.fillRect(x,y+h-1,w,1);ctx.fillRect(x,y,1,h);ctx.fillRect(x+w-1,y,1,h);}
function box(x,y,w,h,opts={}){
  const fill=opts.fill||'#1c2a6c',fill2=opts.fill2||'#12184a';
  rect(x,y,w,h,'#000');
  rect(x+1,y+1,w-2,h-2,fill);
  rect(x+2,y+2,w-4,h-4,fill2);
  // gradient-ish stripes
  ctx.fillStyle=fill;for(let i=0;i<h-4;i+=4)ctx.fillRect(x+2,y+2+i,w-4,1);
  frame(x+2,y+2,w-4,h-4,'#ffffff');
  frame(x+3,y+3,w-6,h-6,'#8090c0');
}
function bar(x,y,w,h,ratio,c1,c2='#202020'){rect(x,y,w,h,c2);const f=Math.round((w-2)*clamp(ratio,0,1));rect(x+1,y+1,f,h-2,c1);frame(x,y,w,h,'#000');}

// palette
const PAL={K:'#101018',W:'#ffffff',R:'#d12a2a',r:'#ff7b6b',O:'#f28c28',Y:'#f9d83a',G:'#2f9e44',g:'#8be36a',B:'#2f56c9',b:'#7fb0f5',
P:'#8a3bc4',p:'#f4a7d9',N:'#8b5a2b',n:'#d4a06a',S:'#f6cfa8',D:'#3d3d48',d:'#7c7c8a',l:'#c8c8d2',T:'#25a5a5',w:'#f8f0dc',M:'#e0489c',
k:'#202030',E:'#5c4b3a',e:'#a58a63',V:'#6b8f3a',v:'#b4d75a',C:'#c0c8f0',c:'#e4e8ff',i:'#3b6bd6',Q:'#ffe8a0',q:'#c9a04a',u:'#4b2c6b',x:'#c9d6e0'};
const spriteCache={};
function drawSprite(rows,x,y,scale=1,flip=false,tint=null){
  const key=rows.join('|')+'#'+scale+'#'+(flip?1:0)+'#'+(tint||'');
  let c=spriteCache[key];
  if(!c){
    const h=rows.length,w=rows[0].length;
    c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;const g=c.getContext('2d');
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];if(ch==='.'||ch===' ')continue;
      g.fillStyle=tint||PAL[ch]||'#f0f';const px=flip?(w-1-i):i;g.fillRect(px*scale,j*scale,scale,scale);}
    spriteCache[key]=c;
  }
  ctx.drawImage(c,Math.round(x),Math.round(y));
}

// ---------- AUDIO ----------
const NOTE_FREQ={};(()=>{const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];for(let o=0;o<9;o++)for(let i=0;i<12;i++){NOTE_FREQ[names[i]+o]=440*Math.pow(2,(o*12+i-57)/12);}})();
const AudioSys={
  ctx:null,master:null,on:true,song:null,songName:null,timer:null,
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=0.5;this.master.connect(this.ctx.destination);}catch(e){}},
  resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  toggle(){this.on=!this.on;if(this.master)this.master.gain.value=this.on?0.5:0;},
  tone(freq,dur,type='square',vol=0.2,slide=0,t0=null){
    if(!this.ctx)return;const t=t0??this.ctx.currentTime;const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.02);
  },
  noise(dur,vol=0.2,t0=null){
    if(!this.ctx)return;const t=t0??this.ctx.currentTime;const n=Math.floor(this.ctx.sampleRate*dur);const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);const d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=this.ctx.createBufferSource();s.buffer=buf;const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(g);g.connect(this.master);s.start(t);
  },
  sfx(name){
    if(!this.ctx)return;const t=this.ctx.currentTime;
    switch(name){
      case 'cursor':this.tone(880,0.05,'square',0.12);break;
      case 'confirm':this.tone(660,0.06,'square',0.15);this.tone(990,0.1,'square',0.15,0,t+0.06);break;
      case 'cancel':this.tone(440,0.08,'square',0.12,-200);break;
      case 'error':this.tone(200,0.15,'sawtooth',0.15,-100);break;
      case 'hit':this.noise(0.12,0.3);this.tone(150,0.12,'square',0.2,-100);break;
      case 'crit':this.noise(0.2,0.4);this.tone(300,0.2,'sawtooth',0.25,-250);break;
      case 'magic':for(let i=0;i<6;i++)this.tone(400+i*120,0.1,'triangle',0.15,0,t+i*0.04);break;
      case 'heal':for(let i=0;i<4;i++)this.tone(523*Math.pow(2,i/12*4),0.18,'sine',0.18,0,t+i*0.08);break;
      case 'shield':this.tone(300,0.25,'triangle',0.2,300);break;
      case 'marker':this.tone(1400+Math.random()*800,0.08,'sawtooth',0.05,-400);break;
      case 'pop':this.tone(600,0.08,'square',0.2,600);break;
      case 'dp':this.tone(700,0.05,'triangle',0.12,300);break;
      case 'levelup':[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,0.25,'square',0.15,0,t+i*0.09));break;
      case 'item':this.tone(700,0.08,'triangle',0.15);this.tone(1050,0.12,'triangle',0.15,0,t+0.08);break;
      case 'chest':[600,800,1000,1400].forEach((f,i)=>this.tone(f,0.12,'square',0.15,0,t+i*0.06));break;
      case 'step':this.noise(0.03,0.04);break;
      case 'encounter':for(let i=0;i<8;i++)this.tone(200+i*90,0.06,'square',0.15,0,t+i*0.03);break;
      case 'die':this.tone(220,0.5,'sawtooth',0.2,-180);this.noise(0.4,0.15);break;
      case 'text':this.tone(1200,0.02,'square',0.04);break;
      case 'poison':this.tone(180,0.2,'sawtooth',0.12,60);break;
      case 'flee':for(let i=0;i<5;i++)this.noise(0.05,0.1,t+i*0.08);break;
      case 'buff':this.tone(500,0.1,'square',0.15,200);this.tone(700,0.15,'square',0.15,300,t+0.1);break;
      case 'debuff':this.tone(500,0.15,'square',0.15,-200);this.tone(400,0.2,'square',0.15,-200,t+0.12);break;
    }
  },
  // ---- sequencer ----
  parseTrack(str){ // tokens like "C4/2" (note, steps) or "./4" rest
    const out=[];for(const tok of str.trim().split(/\s+/)){if(!tok)continue;const [n,l]=tok.split('/');out.push({n:n==='.'?null:n,l:parseFloat(l||'1')});}return out;
  },
  playSong(name){
    if(this.songName===name)return;this.stopSong();this.songName=name;const s=SONGS[name];if(!s)return;
    this.init();if(!this.ctx)return;
    const tracks=s.tracks.map(tr=>({...tr,notes:this.parseTrack(tr.notes),i:0,t:0}));
    const stepDur=60/s.bpm/4;
    const song={tracks,stepDur,start:this.ctx.currentTime+0.1,loop:s.loop!==false};
    tracks.forEach(tr=>{tr.len=tr.notes.reduce((a,n)=>a+n.l,0);});
    this.song=song;
    const schedule=()=>{
      if(this.song!==song)return;const now=this.ctx.currentTime;
      for(const tr of tracks){
        while(song.start+tr.t*stepDur<now+0.35){
          const nt=tr.notes[tr.i];
          if(nt.n){const f=NOTE_FREQ[nt.n];const when=song.start+tr.t*stepDur;const dur=nt.l*stepDur*(tr.gate||0.85);
            if(tr.wave==='noise')this.noise(Math.min(dur,0.12),(tr.vol||0.1),when);
            else this.tone(f,dur,tr.wave||'square',(tr.vol||0.1)*(this.on?1:1),0,when);}
          tr.t+=nt.l;tr.i++;
          if(tr.i>=tr.notes.length){if(!song.loop){tr.i=tr.notes.length-1;tr.t+=1e9;}else tr.i=0;}
        }
      }
    };
    schedule();this.timer=setInterval(schedule,120);
  },
  stopSong(){if(this.timer)clearInterval(this.timer);this.timer=null;this.song=null;this.songName=null;}
};

// ---------- SAVE ----------
const SAVE_KEY='boardbuddies_save_v1';
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));return true;}catch(e){return false;}}
function loadGame(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}

// ---------- screen effects ----------
const FX={shake:0,flash:0,flashC:'#fff',fade:0,fadeDir:0,fadeCb:null};
function fadeOut(cb){FX.fadeDir=1;FX.fadeCb=cb;}
function fadeIn(){FX.fadeDir=-1;}
function updateFX(){
  if(FX.shake>0)FX.shake--;
  if(FX.flash>0)FX.flash--;
  if(FX.fadeDir===1){FX.fade=Math.min(1,FX.fade+0.08);if(FX.fade>=1){FX.fadeDir=0;const cb=FX.fadeCb;FX.fadeCb=null;if(cb)cb();fadeIn();}}
  else if(FX.fadeDir===-1){FX.fade=Math.max(0,FX.fade-0.06);if(FX.fade<=0)FX.fadeDir=0;}
}
function drawFX(){
  if(FX.flash>0){ctx.globalAlpha=Math.min(1,FX.flash/6);rect(0,0,W,H,FX.flashC);ctx.globalAlpha=1;}
  if(FX.fade>0){ctx.globalAlpha=FX.fade;rect(0,0,W,H,'#000');ctx.globalAlpha=1;}
}

// ===================== BB3 CORE UPGRADES: outlined 16-bit sprites, shadows, gradient windows, echo sequencer =====================
const OUTLINE='#141420';
const spriteCache3={};
// Outlined sprite renderer (auto 1px dark outline like SNES-era sprites). Replaces drawSprite globally.
drawSprite=function(rows,x,y,scale=1,flip=false,tint=null,noOutline=false){
  const key=rows.join('|')+'#'+scale+'#'+(flip?1:0)+'#'+(tint||'')+'#'+(noOutline?1:0);
  let c=spriteCache3[key];
  if(!c){
    const h=rows.length,w=rows[0].length;
    c=document.createElement('canvas');c.width=(w+2)*scale;c.height=(h+2)*scale;const g=c.getContext('2d');
    const solid=(i,j)=>i>=0&&j>=0&&i<w&&j<h&&rows[j][i]!=='.'&&rows[j][i]!==' ';
    if(!noOutline){g.fillStyle=tint?tint:OUTLINE;
      for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){if(solid(i,j))continue;if(solid(i-1,j)||solid(i+1,j)||solid(i,j-1)||solid(i,j+1)){const px=flip?(w-1-i):i;g.fillRect((px+1)*scale,(j+1)*scale,scale,scale);}}}
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];if(ch==='.'||ch===' ')continue;
      g.fillStyle=tint||PAL[ch]||'#f0f';const px=flip?(w-1-i):i;g.fillRect((px+1)*scale,(j+1)*scale,scale,scale);}
    spriteCache3[key]=c;
  }
  ctx.drawImage(c,Math.round(x)-scale,Math.round(y)-scale);
};
function shadow(x,y,w,h){ctx.globalAlpha=0.28;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x,y,w/2,h/2,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
// richer window: vertical gradient + double border
box=function(x,y,w,h,opts={}){
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,opts.fill||'#243a8a');g.addColorStop(1,opts.fill2||'#0e1440');
  rect(x,y,w,h,'#000');ctx.fillStyle=g;ctx.fillRect(x+1,y+1,w-2,h-2);
  frame(x+2,y+2,w-4,h-4,'#f4f4ff');frame(x+3,y+3,w-6,h-6,'#7a8cc8');
};
// extra palette entries for 16-bit shading
Object.assign(PAL,{J:'#ffb347',j:'#ff8c42',z:'#5c7cfa',Z:'#2b3a8a',h:'#a0522d',H:'#deb887',U:'#40e0d0',I:'#9d4edd',o:'#f5f5f5',A:'#ff4d6d',a:'#c9184a',L:'#7cb518',t:'#bfa77a',f:'#8ecae6',F:'#ffd166'});
// ---- sequencer echo: leads marked echo:true get a soft delayed repeat (ensemble feel) ----
AudioSys.playSong=function(name){
  if(this.songName===name)return;this.stopSong();this.songName=name;const s=SONGS[name];if(!s)return;
  this.init();if(!this.ctx)return;
  const tracks=s.tracks.map(tr=>({...tr,notes:this.parseTrack(tr.notes),i:0,t:0}));
  const stepDur=60/s.bpm/4;
  const song={tracks,stepDur,start:this.ctx.currentTime+0.1,loop:s.loop!==false};
  this.song=song;
  const schedule=()=>{
    if(this.song!==song)return;const now=this.ctx.currentTime;
    for(const tr of tracks){
      while(song.start+tr.t*stepDur<now+0.35){
        const nt=tr.notes[tr.i];
        if(nt.n){const f=NOTE_FREQ[nt.n];const when=song.start+tr.t*stepDur;const dur=nt.l*stepDur*(tr.gate||0.85);
          if(tr.wave==='noise')this.noise(Math.min(dur,0.12),(tr.vol||0.1),when);
          else{this.tone(f,dur,tr.wave||'square',(tr.vol||0.1),0,when);if(tr.echo)this.tone(f,dur*0.8,tr.wave||'square',(tr.vol||0.1)*0.35,0,when+stepDur*1.5);}}
        tr.t+=nt.l;tr.i++;
        if(tr.i>=tr.notes.length){if(!song.loop){tr.i=tr.notes.length-1;tr.t+=1e9;}else tr.i=0;}
      }
    }
  };
  schedule();this.timer=setInterval(schedule,120);
};

// extra sfx
const _sfx=AudioSys.sfx.bind(AudioSys);
AudioSys.sfx=function(name){
  if(!this.ctx)return;const t=this.ctx.currentTime;
  switch(name){
    case 'crack':this.tone(900,0.08,'square',0.18,-500);this.noise(0.06,0.2);return;
    case 'break':[300,450,600,900,1200].forEach((f,i)=>this.tone(f,0.16,'square',0.18,0,t+i*0.05));this.noise(0.25,0.25,t+0.2);return;
    case 'perfect':[784,988,1319,1568].forEach((f,i)=>this.tone(f,0.2,'triangle',0.2,0,t+i*0.06));return;
    case 'miss':this.tone(300,0.25,'sawtooth',0.15,-150);return;
    case 'ring':this.tone(1200,0.03,'sine',0.05);return;
    case 'stun':this.tone(500,0.3,'triangle',0.15,-300);this.tone(250,0.3,'triangle',0.1,-100,t+0.1);return;
    case 'focus':this.tone(400,0.12,'sine',0.15,400);this.tone(800,0.2,'sine',0.12,200,t+0.12);return;
    case 'bigslam':this.noise(0.35,0.4);this.tone(90,0.4,'sawtooth',0.3,-60);return;
  }
  _sfx(name);
};

function buildOverworld(){
  const W=72,H=54;const rng=mulberry(1194);const g=[];for(let y=0;y<H;y++)g.push(Array(W).fill('g'));
  const set=(x,y,c)=>{if(x>0&&y>0&&x<W-1&&y<H-1)g[y][x]=c;};
  const blob=(cx,cy,r,c,p=1)=>{for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){const d=Math.hypot(x-cx,y-cy);if(d<=r&&rng()<p*(1-d/(r+1)+0.3))set(x,y,c);}};
  for(let x=0;x<W;x++){g[0][x]='F';g[H-1][x]='F';}for(let y=0;y<H;y++){g[y][0]='F';g[y][W-1]='F';}
  // Sherwood Forest (north centre), Barnsdale (north east), southern woods
  blob(30,10,9,'F',0.9);blob(22,14,5,'F',0.8);blob(38,12,6,'F',0.85);blob(58,6,5,'F',0.85);blob(62,42,5,'F',0.8);blob(20,44,4,'F',0.8);blob(6,40,4,'F',0.7);
  // hills (south-west and north-east ridges), moorland
  blob(8,14,4,'A',0.8);blob(66,18,4,'A',0.8);blob(50,50,3,'A',0.7);blob(4,26,3,'A',0.7);
  for(let y=18;y<=24;y++)for(let x=56;x<=68;x++)if(g[y][x]==='g'&&rng()<0.7)set(x,y,'G');
  for(let y=40;y<=50;y++)for(let x=26;x<=40;x++)if(g[y][x]==='g'&&rng()<0.5)set(x,y,'G');
  // River Trent: west to south-east, meandering
  for(let x=1;x<W-1;x++){const ry=34+Math.round(Math.sin(x/7)*3+x*0.18);set(x,ry,'w');set(x,ry+1,'w');}
  // River Leen north-south into Nottingham
  for(let y=2;y<36;y++){const rx=44+Math.round(Math.sin(y/5)*2);set(rx,y,'w');}
  // farmland around villages, hedgerows
  const farm=(cx,cy)=>{for(let y=cy-3;y<=cy+3;y++)for(let x=cx-6;x<=cx+6;x++)if(g[y]&&g[y][x]==='g'&&rng()<0.85)set(x,y,'q');for(let x=cx-6;x<=cx+6;x++)if(rng()<0.6){if(g[cy-4]&&g[cy-4][x]==='g')set(x,cy-4,'h');if(g[cy+4]&&g[cy+4][x]==='g')set(x,cy+4,'h');}};
  farm(14,29);farm(48,17);farm(16,12);farm(40,41);farm(30,26);
  // ponds & flowers
  blob(20,36,2,'w',1);blob(52,24,1,'w',1);
  for(let i=0;i<160;i++){const x=2+Math.floor(rng()*(W-4)),y=2+Math.floor(rng()*(H-4));if(g[y][x]==='g')set(x,y,'k');}
  // roads (carve through forest/farm/hedge; bridges over water)
  const road=(x1,y1,x2,y2)=>{let x=x1,y=y1;while(x!==x2||y!==y2){const c=g[y][x];g[y][x]=(c==='w')?'=':'.';if(x!==x2&&(y===y2||rng()<0.5))x+=Math.sign(x2-x);else if(y!==y2)y+=Math.sign(y2-y);}g[y][x]=(g[y][x]==='w')?'=':'.';};
  const P=DOOR_POS;const below=k=>[P[k][0],P[k][1]+1];
  road(...below('a'),...below('1'));road(...below('a'),...below('d'));road(...below('a'),...below('e'));road(...below('1'),...below('b'));road(...below('b'),...below('2'));road(...below('b'),...below('5'));
  road(...below('5'),...below('c'));road(...below('c'),...below('0'));road(...below('c'),...below('4'));road(...below('c'),...below('9'));road(...below('9'),...below('6'));road(...below('6'),...below('x'));
  road(...below('d'),...below('3'));road(...below('d'),...below('7'));road(...below('7'),...below('8'));road(...below('c'),...below('7'));road(...below('e'),...below('b'));
  const isRoad=(x,y)=>g[y][x]==='.'||g[y][x]==='=';const setKeep=(x,y,c)=>{if(!isRoad(x,y))set(x,y,c);};
  for(const k in P){const [x,y]=P[k];const b=BUILDINGS[k];
    if(b.room){for(let j=-2;j<=-1;j++)for(let i=-2;i<=2;i++)setKeep(x+i,y+j,'R');for(let i=-2;i<=2;i++)setKeep(x+i,y,'W');}
    else if(b.dun===10||b.dun===4||b.dun===11||b.dun===7){for(let j=-2;j<=-1;j++)for(let i=-2;i<=2;i++)setKeep(x+i,y+j,'Z');for(let i=-2;i<=2;i++)setKeep(x+i,y,'Z');}
    else{for(let i=-1;i<=1;i++)setKeep(x+i,y-1,'F');setKeep(x-1,y,'F');setKeep(x+1,y,'F');}
    g[y][x]=k;g[y+1][x]='.';}
  g[17][30]='P';
  return g.map(r=>r.join(''));
}

function genDungeon(n){
  const D=DUNGEON_INFO[n];const rng=mulberry(2000+n*91);const W=46,H=14;const g=[];for(let y=0;y<H;y++)g.push(Array(W).fill('#'));
  const rooms=[[1,11],[13,23],[25,35],[37,44]];const rects=[];
  rooms.forEach(([x1,x2],i)=>{const top=1+Math.floor(rng()*2),bot=H-2-Math.floor(rng()*2);const l=i===0?1:x1+Math.floor(rng()*2),r=i===3?44:x2-Math.floor(rng()*2);rects.push([l,top,r,bot]);for(let y=top;y<=bot;y++)for(let x=l;x<=r;x++)g[y][x]='.';});
  for(let i=0;i<3;i++){const wallX=rooms[i][1]+1;const y=3+Math.floor(rng()*(H-6));g[y][wallX]='o';g[y][wallX-1]='.';g[y][wallX+1]='.';}
  const decor=D.decor.split('');
  rects.forEach(([l,t,r,b],i)=>{const n=6+Math.floor(rng()*5);for(let k=0;k<n;k++){const x=l+1+Math.floor(rng()*(r-l-1)),y=t+1+Math.floor(rng()*(b-t-1));if(g[y][x]==='.'&&!(i===0&&x<5&&y<5))g[y][x]=decor[Math.floor(rng()*decor.length)];}});
  const place=(i,c)=>{const [l,t,r,b]=rects[i];for(let tries=0;tries<50;tries++){const x=l+1+Math.floor(rng()*(r-l-1)),y=t+1+Math.floor(rng()*(b-t-1));if(g[y][x]==='.'){g[y][x]=c;return;}}for(let y=t;y<=b;y++)for(let x=l;x<=r;x++)if(g[y][x]==='.'){g[y][x]=c;return;}};
  place(1,'C');place(2,'C');place(3,'C');place(1,'N');
  const [l,t,r,b]=rects[3];g[Math.floor((t+b)/2)][Math.floor((l+r)/2)]='X';
  g[2][2]='P';g[3][2]='o';g[2][3]='.';g[1][2]='.';
  return g.map(r=>r.join(''));
}

   "*|TIP: Battles are on a GRID. Move each buddy, then Attack, Skill, Sketch, Item, Focus, Guard or Wait. When all have acted, the enemy takes a turn."],
  pre:[{music:'tense'},"Captain Blackthorn|Robin Hood! The Sheriff pays a hundred marks for your head and I mean to spend it!","Little John|Your head's worth less, captain. And I'm about to make it lighter."],
  post:[{music:'forest4'},"Captain Blackthorn|...tell the Sheriff... I tried...","Robin|Tell him yourself. Run along.","Fred|We won! On a grid! With MOVEMENT!","Friar Tuck|The gnome is easily pleased. I like him.",
   "Robin|The camp's north of here, under the Major Oak. Rest, then Locksley. The miller's boy is missing and I owe that miller."]},
 {name:'The Burning Mill',loc:'2',lvl:4,boss:'forestchief',adds:['forester'],rescue:['much'],
  intro:[{music:'village4'},"*|Locksley Mill. Smoke over the millpond. The Sheriff's foresters have the miller's son in a sack.","Fred|Why do they take EVERYONE?","Robin|Because the Sheriff can't catch me, so he catches everyone I love. Much is the youngest of us. He shouldn't be in a sack."],
  pre:[{music:'tense'},"Chief Forester Hob|Locksley! You're a wolf's head, and I'm the hunter!","Robin|You hunt boys in sacks, Hob."],
  post:[{music:'village4'},"Much|Get me OUT of this... oh. Robin! I threw a stone at him. Got him right in the helmet.","Robin|Good lad. Better aim than the foresters.",{join:'much'},"Much|Who's the gnome?","Fred|Fred. Board Buddy. Long story.","Much|I like stories. Tell it while we walk."]},
 {name:'The Fish in the Pond',loc:'3',lvl:7,boss:'alphawolf',adds:['wolf'],rescue:['flurb'],
  intro:[{music:'forest4'},"*|Barnsdale Wood. Something pink is lying in a pond, surrounded by a pack of wolves that cannot decide what it is.","Flurb|...blorp. I'm fine. I'm in a pond. This is the best captivity I've ever had.","Fred|FLURB! Don't move!","Flurb|I wasn't going to."],
  pre:[{music:'tense'},"The Grey Alpha|GRRRRR.","Little John|It's a wolf, Robin. It's not going to monologue.","Friar Tuck|Everything monologues if you hit it hard enough."],
  post:[{music:'forest4'},"Flurb|Thank you. I'd have got out eventually. In a few months.",{join:'flurb'},"Robin|Two Buddies back. The Sheriff's captains keep muttering about a cousin of mine in Locksley lane. Will Scarlet. He'll want to fight before he talks. That's family."]},
 {name:'Scarlet in the Lane',loc:'2',lvl:9,boss:'willboss',adds:[],rescue:['willscarlet'],
  intro:[{music:'village4'},"*|Locksley lane. A young man in red is beating three of the Sheriff's men with a stick, out of boredom.","Will Scarlet|You there, forester! Yes, the one in green. Fight me.","Robin|I'm not a forester.","Will Scarlet|Then what are you?","Robin|Curious."],
  pre:[{music:'tense'},"Will Scarlet|On guard!","Much|He's going to hit us with a stick.","Little John|Everyone does eventually."],
  post:[{music:'village4'},"Will Scarlet|...Robin? ROBIN LOCKSLEY? Cousin! I've been looking for you since Easter!","Robin|You found me with a stick.","Will Scarlet|It's how our family says hello.",{join:'willscarlet'},"Fred|Everyone in this shire hits first and asks after.","Friar Tuck|It saves time."]},
 {name:'The Bog King',loc:'5',lvl:11,boss:'bandking',adds:['bandit','bandit'],rescue:['donny'],
  intro:[{music:'forest4'},"*|Blidworth Bogs. Bandits in the reeds. In a cage on a pole, a yellow duck with a tiny crown is giving orders nobody follows.","Donny|Bandit! Fetch my royal breakfast! Bandit! You're doing it WRONG!","Fred|Donny!","Donny|Fred! Excellent! Tell them I'm a king. They don't believe me."],
  pre:[{music:'tense'},"The Bog King|Only ONE king in this bog, and it's me. Robin Hood, you'll pay the bog toll!","Donny|He charges a toll for MUD."],
  post:[{music:'forest4'},"Donny|Down to Dunce, your majesty.",{join:'donny'},"Robin|The duck is... confident.","Fred|He's earned it. Mostly.","Will Scarlet|Fountain Dale next, Robin. Alan-a-Dale's sweetheart is being married off to an old knight tomorrow. He's been singing about it all week."]},
 {name:"The Minstrel's Wedding",loc:'6',lvl:13,boss:'sirstephen',adds:['spearman','archer'],rescue:['alan'],
  intro:[{music:'village4'},"*|Fountain Dale. A church, a bride in tears, an old knight in a new tabard, and a minstrel outside the door singing a very sad song.","Alan-a-Dale|...and Ellen wept, for Stephen crept, and NOBODY came to help...","Friar Tuck|Somebody's come, lad. Robin, may I? I do a lovely wedding. I also do a lovely stopping-of-one.","*|WARNING: Sir Stephen's guards are stronger. Knights shrug off ordinary hits. Break them."],
  pre:[{music:'tense'},"Sir Stephen|Who DARES interrupt?","Friar Tuck|The Church, my son. Specifically, me."],
  post:[{music:'village4'},"Alan-a-Dale|Ellen! ELLEN! We're getting married! Friar, quickly, before another knight turns up!","Friar Tuck|Dearly beloved, we are gathered here in a hurry...",{join:'alan'},"Alan-a-Dale|I'll follow you anywhere, Robin. I'll write it all down. In verse. Some of it will rhyme."]},
 {name:'Under Nottingham',loc:'4',lvl:15,boss:'jailerboss',adds:['jailer'],rescue:['manny','stutely'],
  intro:[{music:'castle'},"*|The Nottingham dungeons. Dripping stone. In one cell, a scout named Will Stutely. In the next, a mongoose who has bitten every guard on the floor.","Manny|I HAVE SEEN A COBRA. It was a jailer. It was close enough.","Will Stutely|He hasn't stopped saying that for three days.","*|WARNING: difficulty spike. Grinding is studying."],
  pre:[{music:'tense'},"Grimble the Jailer|Nobody LEAVES. Nobody. Not the outlaws, not the rat, not the... what IS that?","Manny|Mongoose. And I've been leaving all week."],
  post:[{music:'castle'},"Will Stutely|Free. Thank you, Robin. I'll scout ahead from now on. Nobody sees me coming.","Manny|I SEE you coming.","Will Stutely|You're a mongoose.",{join:'manny'},{join:'stutely'},"Robin|The Sheriff's holding an archery contest. Silver arrow for the prize. It's a trap, obviously.","Little John|Obviously.","Robin|I'm going anyway.","Little John|Obviously."]},
 {name:'The Silver Arrow',loc:'c',lvl:17,boss:'champion',adds:['archer','spearman'],rescue:['marian'],town:true,
  intro:[{music:'castle'},"*|Nottingham market. Butts set up in the square. Guards in every doorway. The Sheriff on a raised chair, smiling like a man who has set a trap and is proud of it.",
   "Robin|A one-eyed beggar with a limp. Nobody looks twice at a beggar.","Fred|You're not limping.","Robin|I'm limping on the inside.",
   "*|A slim page in the Sheriff's colours steps up to shoot. Splits the wand at a hundred paces. Robin stares.","Page|...Well? Shoot, beggar. Unless you're afraid of a page."],
  pre:[{music:'tense'},"The Sheriff|SEIZE HIM! Nobody shoots like that but HOOD!","Gilbert the Champion|The Sheriff's champion does, and I'll prove it on your hide!","Page|Oh, for heaven's sake. Robin, DUCK."],
  post:[{music:'village4'},"Gilbert the Champion|...you shoot well, beggar. Better than I. I yield.","Robin|Keep your arrow, Gilbert. I'll take the page.","Page|The page is not FOR taking.","*|The page pulls off the cap. Long hair. A very familiar smile.","Marian|Hello, Robin. You still can't spot a disguise.",{join:'marian'},"Little John|You lost to HER.","Robin|I let her win.","Marian|He did not."]},
 {name:'The Toll of Trent Bridge',loc:'9',lvl:20,boss:'tollknight',adds:['crossbow','crossbow'],rescue:['bindi'],
  intro:[{music:'shire'},"*|Trent Crossing. A stone bridge, a tower, and a knight who charges a penny to cross and two to look at the river. In the tower, a bookmark is keeping his ledger under protest.","Bindi|I have recorded every tax. EVERY tax. When this is over I am reading them ALL to a magistrate.","Fred|Bindi!","Bindi|Fred, form a queue, I'm nearly finished with the ledger."],
  pre:[{music:'tense'},"Sir Toll|Toll to cross! Toll to fight! Toll to LOSE!","Marian|He charges for losing.","Sir Toll|Everything costs, my lady."],
  post:[{music:'shire'},"Sir Toll|...refund...","Bindi|Denied. Read the ledger.",{join:'bindi'},"Will Stutely|Scouted east, Robin. Guy of Gisborne's hunting lodge. He's got Rex, the ruler, measuring gallows. Guy wears a horse.","Fred|Wears a... horse?","Will Stutely|As a coat. Hide and all. He's not well."]},
 {name:'Gisborne',loc:'8',lvl:24,boss:'guy1',adds:['forester'],rescue:['rex'],
  intro:[{music:'forest4'},"*|Gisborne's hunting lodge. Antlers on every wall. A man in a horsehide cloak sharpening a sword. A ruler on the table, being used to measure a noose.","Rex|Thirty centimetres. Thirty-one. This is NOT to scale.","Sir Guy|Quiet, stick.","Rex|I am a RULER. And you are a RUDE MAN in a HORSE.","*|WARNING: difficulty spike. Guy counters melee. Range and breaks."],
  pre:[{music:'tense'},"Sir Guy|Hood. At last. I'll wear your head and your hood and the Sheriff will pay double.","Robin|You could just buy a hat, Guy.","Sir Guy|WHERE'S THE SPORT IN A HAT."],
  post:[{music:'forest4'},"Sir Guy|...another day, outlaw. Another day.","*|Guy vanishes into the trees with the ease of a man who has run away many times.","Rex|Exactly thirty centimetres of THANK YOU.",{join:'rex'},"Friar Tuck|St Mary's Abbey, Robin. The Bishop of Hereford's there with a 'holy relic' that swears in a voice like a small square."]},
 {name:'The Holy Light',loc:'7',lvl:26,boss:'bishopboss',adds:['monk','monk'],rescue:['pip'],
  intro:[{music:'castle'},"*|St Mary's Abbey. Gold everywhere. In a glass reliquary on the altar, a tiny cyan square is telling the Bishop of Hereford exactly what it thinks of him.","Pip|-and ANOTHER thing, you gilded TOAST-","The Bishop|The relic speaks! Bring more gold!","Pip|I'm a PIXEL, you absolute CANDLE."],
  pre:[{music:'tense'},"The Bishop|Outlaws in the house of God! Brothers, DEFEND THE RELIC!","Friar Tuck|I'm a friar, Your Grace. I'm allowed in here. You're the one who should be nervous."],
  post:[{music:'castle'},"The Bishop|...take the relic... take it ALL... just stop it TALKING...","Pip|I'll stop talking when he stops being a TOAST.",{join:'pip'},"Robin|The Bishop's coffers, Tuck. Locksley's harvest tax is in there.","Friar Tuck|Then Locksley shall have it back. With interest. I'm a very forgiving friar, but I can count."]},
 {name:'The Tanner of Barnsdale',loc:'3',lvl:29,boss:'arthurboss',adds:[],rescue:['arthur'],
  intro:[{music:'forest4'},"*|Barnsdale Wood again. A tanner with arms like oak roots is fighting off six of the Sheriff's men with a staff, and winning.","Arthur-a-Bland|Come on then! All of you! I've tanned tougher hides than yours!","Little John|...That's my cousin. Arthur. He'll want to fight me first.","Robin|Everyone in this shire-","Little John|I KNOW."],
  pre:[{music:'tense'},"Arthur-a-Bland|Big man! Stick fight! Winner buys the ale!","Little John|Loser buys. That's how it works.","Arthur-a-Bland|Then I'll be buying, because I'm about to LOSE ON PURPOSE. Ha! No I'm not."],
  post:[{music:'forest4'},"Arthur-a-Bland|Ha! Nobody's hit me like that since... well, since you, John. Cousin! Where've you BEEN?","Little John|Outlawing.","Arthur-a-Bland|Room for a tanner?",{join:'arthur'},"Robin|There's room for everyone under the oak. That's rather the point of us."]},
 {name:'The Camp Burns',loc:'1',lvl:31,boss:'sirroger',adds:['mercenary','mercenary'],rescue:[],
  intro:[{music:'tense'},"*|Smoke over Sherwood. Prince John's mercenaries have found the camp. Sir Roger of Doncaster stands in the ashes of the larder.","Sir Roger|Cook's dead- no. Cook's hiding. Cook's a coward. Where's Hood?","Fred|Behind you.","Sir Roger|That's the OLDEST-","*|It was not, in fact, a trick.","*|WARNING: difficulty spike."],
  pre:[{music:'tense'},"Sir Roger|Prince John pays me by the head. I'll take yours, Hood, and the friar's, and I'll take the DUCK as a curiosity.","Donny|I am NOT a curiosity. I am a MONARCH."],
  post:[{music:'forest4'},"Sir Roger|...you'll regret this... the Prioress at Kirklees... she'll...","*|Sir Roger runs. The camp is scorched, but the oak still stands.","Marian|The Prioress of Kirklees? She's Robin's kinswoman. Why would she...","Robin|Later. Cook's alive, the oak's alive, and the Sheriff's holding a fair at Mansfield. Everybody says it's a trap.","Little John|Obviously.","Robin|Obviously."]},
 {name:'Mansfield Fair',loc:'e',lvl:33,boss:'sheriff1',adds:['spearman','archer'],rescue:[],town:true,
  intro:[{music:'village4'},"*|Mansfield Fair. Pies, ribbons, a wrestling ring, and the Sheriff's men in every stall pretending to sell eggs.","Much|That man has been holding one egg for an hour.","Alan-a-Dale|That's a bad egg-seller and a worse spy. Shall I sing about it?","Robin|Not yet."],
  pre:[{music:'tense'},"The Sheriff|HOOD! I knew you couldn't resist a fair. Nobody outlaws a PIE.","Friar Tuck|He's right, you know.","The Sheriff|GUARDS! Earn your wages!"],
  post:[{music:'village4'},"The Sheriff|This isn't OVER, Hood! The Prince is coming! The PRINCE!","*|The Sheriff flees on a stolen pie-cart. The pies survive.","Marian|My father's hall at Edwinstowe. The Sheriff will go there next, to punish me. We have to reach it first."]},
 {name:'The Hall at Edwinstowe',loc:'d',lvl:35,boss:'guy2',adds:['knight','wolf'],rescue:['gilbert'],town:true,
  intro:[{music:'village4'},"*|Edwinstowe. Marian's father's hall, its gates barred, Guy of Gisborne's hunters camped outside with their hounds. On the wall, a lone archer holds them off.","Gilbert|I've six arrows left and a hundred targets! Somebody DO something!","Marian|Gilbert? The Sheriff's champion?","Gilbert|FORMER champion. I resigned. Loudly. It did not go well."],
  pre:[{music:'tense'},"Sir Guy|Locksley. Your hood. Give it to me and I'll let the lady's father live.","Robin|My hood's not for sale, Guy. Neither's her father.","Sir Guy|Then I'll take BOTH."],
  post:[{music:'village4'},"Sir Guy|I will not... lose... to a... DRAWING...","Fred|Ho ho. You just did.","*|Guy of Gisborne falls. His hunters scatter. The hall's gates open.","Gilbert|I'll shoot for Sherwood, Robin. Second-best archer in England, at your service.","Marian|Second?","Gilbert|...Third.",{join:'gilbert'}]},
 {name:'The Black Knight',loc:'1',lvl:37,boss:'blackknight',adds:[],rescue:[],
  intro:[{music:'forest4'},"*|A stranger rides into Sherwood. Black armour, no crest, a laugh like a door slamming. He asks, politely, for a fight.","The Black Knight|I've heard the outlaws of Sherwood are the finest fighters in England. I've come to be disappointed.","Little John|We'll do our best.","The Black Knight|Splendid! Everyone at once, please. I've had a long ride."],
  pre:[{music:'tense'},"The Black Knight|Well struck! AGAIN!","Will Scarlet|He's ENJOYING this.","Friar Tuck|Some knights do. Hit him harder, he'll enjoy it more."],
  post:[{music:'shire'},"The Black Knight|Enough! ENOUGH! Ha ha ha! You fight like free men! I haven't been hit like that since the Holy Land!",
   "*|The knight raises his visor. Robin drops to one knee. Then everyone does. Even Donny, who takes a moment.","King Richard|Rise, Locksley. I've a brother to deal with and a shire to put right. I'll need archers.","Robin|Sire, you'll have every one of us.","King Richard|Good. Now: which of you is the duck with the crown, and why is it bowing SIDEWAYS?"]},
 {name:'Hold the Bridge',loc:'9',lvl:40,boss:'general',adds:['knight','crossbow'],rescue:[],
  intro:[{music:'tense'},"*|Trent Crossing. Prince John's army marches on Nottingham to hold the castle against the King. The bridge is the only way. The Merry Men are the only wall.","Little John|I held a bridge against Robin once.","Robin|You held it against ME. This is an ARMY.","Little John|Then it's a bigger bridge.","*|WARNING: difficulty spike."],
  pre:[{music:'tense'},"Prince John's General|Outlaws on the bridge. Cavalry, FORWARD.","Arthur-a-Bland|Cavalry. On a bridge. Lovely. Hide wall, everyone!"],
  post:[{music:'shire'},"Prince John's General|...the Prince... will burn... you all...","*|The army breaks. The bridge holds. Little John sits down very heavily on it.","Little John|Told you. Bigger bridge."]},
 {name:"Gisborne's Last Hunt",loc:'8',lvl:42,boss:'guy2',adds:['forester','forester'],rescue:[],
  intro:[{music:'forest4'},"*|The lodge, rebuilt in spite. Guy of Gisborne, scarred, alone but for his hunters, waits by the fire with a hood that is not his.","Sir Guy|I made my own, Hood. See? It's better.","Robin|It's a horse, Guy.","Sir Guy|IT'S BETTER."],
  pre:[{music:'tense'},"Sir Guy|No Sheriff. No Prince. Just you and me and the hood, Locksley.","Robin|And fifteen of my friends.","Sir Guy|...that's cheating.","Robin|That's Sherwood."],
  post:[{music:'forest4'},"Sir Guy|...I only wanted... to be the one they sang about...","Alan-a-Dale|I'll sing about you, Guy. It won't be flattering. But it'll be sung.","*|Sir Guy of Gisborne rides away for the last time, and is not seen in Sherwood again."]},
 {name:'Roger of Doncaster',loc:'x',lvl:44,boss:'sirroger',adds:['sirroger_guard','mercenary'],rescue:[],
  intro:[{music:'dirge'},"*|Kirklees Priory. Robin's kinswoman the Prioress greets them at the gate with a smile that does not reach her eyes. In the cloister, Sir Roger of Doncaster waits.","The Prioress|Cousin Robin. You look tired. You should rest here. Soon.","Marian|(Robin. Don't trust her.)","Robin|(I know. But I need to know what she's planning.)"],
  pre:[{music:'tense'},"Sir Roger|The Prioress sends her regards, Hood. And her poison.","Friar Tuck|Poison! In a PRIORY! I shall be writing to the Archbishop."],
  post:[{music:'dirge'},"Sir Roger|...she'll finish it... when you're weak... you'll come back here... they always come back...","*|Sir Roger flees again. The Prioress has vanished into the priory. Robin says nothing for a long while.","Robin|Nottingham. The Sheriff, the Prince. We end this now, while I still... while there's time.","Little John|Robin?","Robin|I'm fine, John. Castle. Now."]},
 {name:'The Castle Gate',loc:'0',lvl:46,boss:'sheriff2',adds:['knight','captain'],rescue:[],
  intro:[{music:'castle'},"*|Nottingham Castle. The King's banner flies over the town but the Prince's flies over the keep. The Sheriff holds the great hall with everything he has left.","Robin|Sixteen of us against a castle.","Donny|Seventeen. I'm counting the crown.","Fred|Everyone. This is what we were drawn for. And what you were WRITTEN for, Robin.","Robin|Then let's give the book a good chapter.","*|WARNING: difficulty spike. Level 46. Stock up. Save."],
  pre:[{music:'tense'},"The Sheriff|HOOD! You've cost me everything! My gold, my Guy, my PIES!","Friar Tuck|The pies were never yours, Sheriff.","The Sheriff|GARRISON! NOW!"],
  post:[{music:'castle'},"The Sheriff|...Prince... PRINCE! Help me!","*|The Sheriff of Nottingham crawls up the stairs toward the throne room. The great hall is theirs.","Robin|Up. The Prince is up."]},
 {name:'Prince John',loc:'0',lvl:48,boss:'princejohn',adds:['sheriff1'],rescue:[],final:true,
  intro:[{music:'castle'},"*|The throne room. Prince John on his brother's throne, the Sheriff cowering at his feet, the crown of England sitting badly on the wrong head.","Prince John|Locksley. You've ruined my shire, my Sheriff, and my afternoon. Kneel to your PRINCE.","Robin|We kneel to the King, sire. He's on his way. He said to keep his seat warm.","Prince John|...Richard is DEAD.","Marian|He's really not."],
  pre:[{music:'tense'},"Prince John|Sheriff! Get UP! GET UP AND FIGHT!","The Sheriff|Yes, sire... yes...","Prince John|England is MINE to bleed. Take them. TAKE THEM ALL."],
  post:[{music:'shire'},"Prince John|...he isn't dead, is he... Richard is coming home...","*|Hoofbeats in the courtyard. A black knight, then a hundred more. The Prince sits down on the steps of the throne and puts his head in his hands.",
   "King Richard|Brother. Get off my chair.","*|Nottingham is free. The Sheriff is stripped of office. The Prince is sent to think about what he's done, which takes years.",
   "Robin|It's done, buddies. The shire's free. The King's home.","Fred|Then why aren't you smiling?","Robin|I am. I'm just... tired, Fred. A long war makes a man tired.","Little John|You're pale, Robin.","Robin|Kirklees. My cousin can bleed a fever. One last visit. Then home to the greenwood."]},
 {name:'Kirklees',loc:'x',lvl:48,boss:'sirroger',adds:['sirroger_guard'],rescue:[],last:true,
  intro:[{music:'dirge'},"*|Kirklees Priory. Robin, grey and fevered, leans on Little John at the gate. The Prioress opens it herself.","The Prioress|Cousin. Come in. I'll bleed the fever from you. Rest.","Little John|I'm coming in with him.","The Prioress|Men are not permitted past the gate, sir. Only family.","*|The door closes. Little John waits. And waits. Then he hears a horn: three notes, faint, from the tower.","Little John|THAT'S ROBIN'S HORN. BREAK THE DOOR."],
  pre:[{music:'tense'},"Sir Roger|Too late, big man! She's bled him white and locked the tower!","Little John|Then I'll come through you AND the tower.","Friar Tuck|Lord forgive me for what I'm about to do in a priory."],
  post:[{music:'dirge'},"*|The tower door splinters. Robin is in the bed by the window, white as the sheets, the bow across his knees. He smiles.",
   "Robin|John. You took your time.","Little John|I'll burn this place down, Robin. I'll-","Robin|You'll do no such thing. I never harmed a woman in my life and I'll not start at the end of it.","Robin|String my bow, John. Open the window. Wherever this arrow falls, that's where you bury me. Green turf. Sherwood on either side.",

   "*|Robin Hood dies at Kirklees, with the Merry Men and Marian and the Board Buddies around him, and the greenwood outside the window."]}
];

let G=null;
function heroStat(h,k){const d=HEROES[h.id];return Math.floor(d.base[k]+d.grow[k]*(h.lvl-1));}
function mkHero(id){const h={id,lvl:1,xp:0};h.hp=heroStat(h,'hp');h.mp=heroStat(h,'mp');return h;}
function heroSkills(h){return HEROES[h.id].skills.filter(s=>SKILLS[s].lvl<=h.lvl);}
function heroDraws(h){return HEROES[h.id].draws;}
function addXP(h,xp){const gained=[];h.xp+=xp;while(h.lvl<70&&h.xp>=XP_FOR(h.lvl)){h.lvl++;gained.push(h.lvl);h.hp=heroStat(h,'hp');h.mp=heroStat(h,'mp');}return gained;}
function levelUpHero(h){h.xp=Math.max(h.xp,XP_FOR(h.lvl));return addXP(h,0);}
function newGame(){
  G={heroes:{},party:['robin','littlejohn','tuck','fred'],roster:['robin','littlejohn','tuck','fred'],lead:'robin',inv:{oatcake:4,herbs:2,sharp:1,sherbet:2},merit:80,mission:0,missionsDone:[],flags:{},steps:0,battles:0,breaks:0,perfects:0,ending:false,
    savePos:{where:'room',id:'camp'},overMusic:'shire'};
  for(const id in HEROES)G.heroes[id]=mkHero(id);
  for(const h of partyHeroes()){h.lvl=2;h.xp=XP_FOR(1);h.hp=heroStat(h,'hp');h.mp=heroStat(h,'mp');}
}
function partyHeroes(){return G.party.map(id=>G.heroes[id]);}
function addItem(id,n=1){G.inv[id]=(G.inv[id]||0)+n;if(G.inv[id]<=0)delete G.inv[id];}
function fullHeal(){for(const id of G.roster){const h=G.heroes[id];h.hp=heroStat(h,'hp');h.mp=heroStat(h,'mp');}}
function avgLevel(){const p=partyHeroes();return Math.floor(p.reduce((a,h)=>a+h.lvl,0)/Math.max(1,p.length));}
function joinParty(id){if(G.roster.includes(id))return false;const h=G.heroes[id];const target=avgLevel();if(h.lvl<target){h.lvl=target;h.xp=XP_FOR(target-1);}h.hp=heroStat(h,'hp');h.mp=heroStat(h,'mp');G.roster.push(id);if(G.party.length<4)G.party.push(id);return true;}
function leaveParty(id){const i=G.party.indexOf(id);if(i>=0)G.party.splice(i,1);if(G.lead===id)G.lead=G.party[0];return i>=0;}
function activeMission(){return G.mission<MISSIONS.length?MISSIONS[G.mission]:null;}

const Scene={stack:[],
  push(s){this.stack.push(s);Input.flush();},pop(){this.stack.pop();Input.flush();},
  replace(s){this.stack=[s];Input.flush();},top(){return this.stack[this.stack.length-1];},
  update(){const t=this.top();if(t&&t.update)t.update();},
  draw(){let start=0;for(let i=this.stack.length-1;i>=0;i--){if(this.stack[i].opaque){start=i;break;}}for(let i=start;i<this.stack.length;i++)if(this.stack[i].draw)this.stack[i].draw();}
};
class Dialogue{
  constructor(steps,onDone){this.steps=steps.slice();this.i=-1;this.onDone=onDone;this.chars=0;this.t=0;this.pages=[];this.page=0;this.next();}
  next(){
    this.i++;
    if(this.i>=this.steps.length){Scene.pop();if(this.onDone)this.onDone();return;}
    const s=this.steps[this.i];
    if(typeof s==='string'){const k=s.indexOf('|');this.who=s.slice(0,k);const txt=s.slice(k+1);this.portrait=PORTRAITS[this.who]||null;
      const lines=wrap(txt,this.portrait?40:47);this.pages=[];for(let j=0;j<lines.length;j+=3)this.pages.push(lines.slice(j,j+3));this.page=0;this.chars=0;return;}
    if(s.music)AudioSys.playSong(s.music);
    if(s.join&&joinParty(s.join)){this.steps.splice(this.i+1,0,'*|'+HEROES[s.join].name+' joined the Merry Men! (Lv '+G.heroes[s.join].lvl+')'+(G.party.includes(s.join)?'':' The party is full: swap fighters from the menu.'));AudioSys.sfx('levelup');}
    if(s.leave&&leaveParty(s.leave)){this.steps.splice(this.i+1,0,'*|'+HEROES[s.leave].name+' left the party.');}
    if(s.item){addItem(s.item,s.n||1);this.steps.splice(this.i+1,0,'*|Got '+ITEMS[s.item].name+(s.n>1?' x'+s.n:'')+'!');AudioSys.sfx('chest');}
    if(s.shake)FX.shake=25;if(s.flash){FX.flash=10;FX.flashC='#fff';}if(s.heal)fullHeal();if(s.fn)s.fn();
    this.next();
  }
  update(){this.t++;const pg=this.pages[this.page]||[];const total=pg.reduce((a,l)=>a+l.length,0);
    if(this.chars<total){this.chars+=(keys.KeyZ||keys.Enter||keys.Space)?3:1;if(this.chars%3===0)AudioSys.sfx('text');}
    if(Input.confirmP()){if(this.chars<total)this.chars=total;else{AudioSys.sfx('cursor');if(this.page<this.pages.length-1){this.page++;this.chars=0;}else this.next();}}}
  draw(){const y=H-66;box(0,y,W,66);let tx=14;
    if(this.portrait){rect(8,y+8,52,52,'#0a0a1a');frame(8,y+8,52,52,'#8090c0');drawSprite(SPR[this.portrait],11,y+11,3);tx=68;}
    if(this.who!=='*')text(this.who,tx,y+6,'#f9d83a',1);
    const pg=this.pages[this.page]||[];let left=this.chars;
    for(let j=0;j<pg.length;j++){const l=pg[j];const n=Math.min(l.length,left);left-=n;text(l.slice(0,n),tx,y+15+j*14,this.who==='*'?'#c8d0f0':'#fff',2);if(left<=0)break;}
    const total=pg.reduce((a,l)=>a+l.length,0);if(this.chars>=total&&(this.t>>4)&1)text('}',W-16,y+52,'#f9d83a',2);}
}
function runCutscene(steps,onDone){Scene.push(new Dialogue(steps,onDone));}
function say(line,onDone){runCutscene([line],onDone);}
class Menu{constructor(items,opts={}){this.items=items;this.i=0;this.cols=opts.cols||1;}
  update(){const n=this.items.length;if(!n){if(Input.cancelP()||Input.escP())return 'cancel';return null;}
    if(Input.nav('up')){this.i=(this.i-this.cols+n)%n;AudioSys.sfx('cursor');}if(Input.nav('down')){this.i=(this.i+this.cols)%n;AudioSys.sfx('cursor');}
    if(this.cols>1){if(Input.nav('left')){this.i=(this.i-1+n)%n;AudioSys.sfx('cursor');}if(Input.nav('right')){this.i=(this.i+1)%n;AudioSys.sfx('cursor');}}
    if(Input.confirmP())return 'ok';if(Input.cancelP()||Input.escP())return 'cancel';return null;}
}

      if(ch==='B'){g.fillStyle='#8a5a30';g.fillRect(x+1,y+1,14,12);g.fillStyle='#f8f0dc';g.fillRect(x+2,y+2,12,10);g.fillStyle='#d12a2a';g.fillRect(x+3,y+3,4,2);g.fillStyle='#2f56c9';g.fillRect(x+8,y+4,5,1);g.fillStyle='#2f9e44';g.fillRect(x+3,y+7,8,1);g.fillStyle='#5a3a1a';g.fillRect(x+7,y+13,2,3);}

class MapScene{
  constructor(rows,theme,opts){

    ctx.strokeStyle=s.d.ink;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=3;const pad=8;const n=Math.floor(s.prog);const frac=s.prog-n;
    for(let i=0;i<=n&&i<s.segs.length;i++){const [a,b]=s.segs[i];const j=s.jit[i];let x1=pad+a[0]*(s.w-pad*2)+j[0],y1=pad+a[1]*(s.h-pad*2)+j[1],x2=pad+b[0]*(s.w-pad*2)+j[1],y2=pad+b[1]*(s.h-pad*2)+j[0];if(i===n){x2=lerp(x1,x2,frac);y2=lerp(y1,y2,frac);}ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}

class MissionBoardScene{

  constructor(){this.ids=G.roster.slice();this.menu=new Menu(this.ids);this.msg='Robin always leads. Pick up to 3 more. Up to 4 fight at once.';}

class PauseMenu{
  constructor(map,inBattle){this.map=map;this.inBattle=!!inBattle;this.tabs=inBattle?['Status','Skills','Controls','Back']:['Items','Status','Skills','Party','Controls','Quit to Title'];this.menu=new Menu(this.tabs);this.mode='tabs';this.msg='';this.hero=0;}
  update(){
    if(this.mode==='tabs'){const r=this.menu.update();if(r==='cancel'){AudioSys.sfx('cancel');Scene.pop();return;}
      if(r==='ok'){const t=this.tabs[this.menu.i];AudioSys.sfx('confirm');
        if(t==='Items'){this.items=Object.keys(G.inv).filter(k=>G.inv[k]>0);if(!this.items.length){this.msg='No items.';return;}this.sub=new Menu(this.items);this.mode='items';}
        else if(t==='Status'){this.mode='status';this.hero=Math.max(0,G.party.indexOf(G.lead));}else if(t==='Skills'){this.mode='skills';this.hero=0;}
        else if(t==='Party'){Scene.push(new PartySelect());}else if(t==='Controls')Scene.push(new ControlsScene());else if(t==='Back'){Scene.pop();}else if(t==='Quit to Title'){this.mode='confirm';}}return;}
    if(this.mode==='confirm'){if(Input.confirmP()){AudioSys.sfx('confirm');Scene.pop();AudioSys.stopSong();fadeOut(()=>Scene.replace(new TitleScene()));}else if(Input.cancelP()||Input.escP()){AudioSys.sfx('cancel');this.mode='tabs';}return;}
    if(this.mode==='items'){const r=this.sub.update();if(r==='cancel'){AudioSys.sfx('cancel');this.mode='tabs';return;}
      if(r==='ok'){const id=this.items[this.sub.i],it=ITEMS[id];if(it.battleOnly){AudioSys.sfx('error');this.msg='Battle only!';return;}
        if(it.target==='allies'){for(const h of partyHeroes())this.applyField(it,h);addItem(id,-1);AudioSys.sfx('heal');this.refreshItems();return;}AudioSys.sfx('confirm');this.mode='pickhero';this.hero=0;this.useId=id;}return;}
    if(this.mode==='pickhero'){const n=G.party.length;if(Input.nav('up')){this.hero=(this.hero-1+n)%n;AudioSys.sfx('cursor');}if(Input.nav('down')){this.hero=(this.hero+1)%n;AudioSys.sfx('cursor');}
      if(Input.cancelP()||Input.escP()){AudioSys.sfx('cancel');this.mode='items';return;}
      if(Input.confirmP()){const it=ITEMS[this.useId];const h=partyHeroes()[this.hero];if(this.applyField(it,h)){addItem(this.useId,-1);AudioSys.sfx('heal');this.refreshItems();this.mode=this.items.length?'items':'tabs';}else{AudioSys.sfx('error');this.msg="Can't use that here.";}}return;}
    if(this.mode==='status'){const n=G.party.length;if(Input.nav('left')||Input.nav('up')){this.hero=(this.hero-1+n)%n;AudioSys.sfx('cursor');}if(Input.nav('right')||Input.nav('down')){this.hero=(this.hero+1)%n;AudioSys.sfx('cursor');}
      if(Input.confirmP()&&!this.inBattle){G.lead=G.party[this.hero];AudioSys.sfx('confirm');this.msg=HEROES[G.lead].name+' now leads on the map!';return;}
      if(Input.cancelP()||Input.escP()||(Input.confirmP()&&this.inBattle)){AudioSys.sfx('cancel');this.mode='tabs';}return;}
    if(this.mode==='skills'){const n=G.party.length;if(Input.nav('left')||Input.nav('up')){this.hero=(this.hero-1+n)%n;AudioSys.sfx('cursor');}if(Input.nav('right')||Input.nav('down')){this.hero=(this.hero+1)%n;AudioSys.sfx('cursor');}
      if(Input.cancelP()||Input.escP()||Input.confirmP()){AudioSys.sfx('cancel');this.mode='tabs';}return;}
  }
  refreshItems(){this.items=Object.keys(G.inv).filter(k=>G.inv[k]>0);this.sub=new Menu(this.items);if(this.sub.i>=this.items.length)this.sub.i=Math.max(0,this.items.length-1);}
  applyField(it,h){const mx=heroStat(h,'hp'),mm=heroStat(h,'mp');if(it.type==='heal'){if(h.hp<=0)return false;h.hp=Math.min(mx,h.hp+(it.amt||Math.round(mx*it.pct)));return true;}if(it.type==='mp'){if(h.hp<=0)return false;h.mp=Math.min(mm,h.mp+it.amt);return true;}if(it.type==='revive'){if(h.hp>0)return false;h.hp=Math.round(mx*it.pct);return true;}if(it.type==='full'){h.hp=mx;h.mp=mm;return true;}if(it.type==='cure')return true;return false;}
  draw(){
    ctx.globalAlpha=0.5;rect(0,0,W,H,'#000');ctx.globalAlpha=1;box(0,0,110,H);text('MENU',10,8,'#f9d83a',2);
    this.tabs.forEach((t,i)=>{const y=26+i*16;if(this.mode==='tabs'&&i===this.menu.i)text('}',6,y,'#f9d83a',2);text(t,16,y,i===this.menu.i?'#fff':'#c8d0f0',t.length>9?1:2);});
    text('MISSION '+Math.min(MISSIONS.length,G.mission+1)+'/'+MISSIONS.length,10,150,'#8090c0',1);text('MERITS',10,162,'#8090c0',1);text(G.merit,10,170,'#8be36a',2);text('BREAKS '+G.breaks+'  PERFECT '+G.perfects,10,186,'#25a5a5',1);text('BATTLES '+G.battles,10,198,'#8090c0',1);text('LEAD: '+HEROES[G.lead].name.toUpperCase(),10,210,'#f9d83a',1);text('SAVE: MISSION BOARDS',10,222,'#8090c0',1);
    box(110,0,290,H);const heroes=partyHeroes();
    if(['tabs','confirm','items','pickhero'].includes(this.mode)){
      heroes.forEach((h,i)=>{const y=8+i*40;const d=HEROES[h.id];const mx=heroStat(h,'hp'),mm=heroStat(h,'mp');if(this.mode==='pickhero'&&i===this.hero)text('}',114,y+8,'#f9d83a',2);
        drawSprite(SPR[d.spr],122,y,2,true);text(d.name,160,y,h.hp<=0?'#606880':'#fff',2);text('LV '+h.lvl,240,y,'#f9d83a',2);if(G.lead===h.id)text('LEAD',280,y+1,'#25a5a5',1);
        text('HP '+h.hp+'/'+mx,160,y+13,h.hp<=0?'#ff7b6b':'#c8d0f0',1);bar(160,y+21,100,5,h.hp/mx,'#8be36a');text('MP '+h.mp+'/'+mm,270,y+13,'#c8d0f0',1);bar(270,y+21,60,5,h.mp/mm,'#7fb0f5');if(h.hp<=0)text('KO',340,y+13,'#ff7b6b',2);});
      if(this.mode==='items'||this.mode==='pickhero'){box(200,120,200,120);text('ITEMS',208,126,'#f9d83a',2);const off=Math.max(0,this.sub.i-6);this.items.slice(off,off+7).forEach((id,k)=>{const i=k+off;const y=140+k*12;if(this.mode==='items'&&i===this.sub.i)text('}',206,y,'#f9d83a',2);text(ITEMS[id].name,216,y,ITEMS[id].battleOnly?'#8090c0':'#fff',2);textR('x'+G.inv[id],392,y,'#c8d0f0',2);});const it=ITEMS[this.items[this.sub.i]];if(it)wrap(it.desc,44).forEach((l,i)=>text(l,208,222+i*8,'#c8d0f0',1));}
      if(this.mode==='confirm'){box(150,90,200,50);textC('Quit to title? (unsaved progress lost)',250,98,'#fff',1);textC('Z: YES   X: NO',250,118,'#f9d83a',2);}text(this.msg,120,226,'#f9d83a',1);}
    else if(this.mode==='status'){const h=heroes[this.hero];const d=HEROES[h.id];drawSprite(SPR[d.spr],124,10,3,true);text(d.name,180,10,'#fff',2);text(d.title,180,22,'#f9d83a',1);text('LV '+h.lvl+'   XP '+h.xp+' / '+XP_FOR(h.lvl),180,32,'#c8d0f0',1);
      const rows=[['HP',h.hp+'/'+heroStat(h,'hp')],['MP',h.mp+'/'+heroStat(h,'mp')],['ATK',heroStat(h,'atk')],['DEF',heroStat(h,'def')],['MAG',heroStat(h,'mag')],['SPD',heroStat(h,'spd')],['MOV',d.mov],['RANGE',d.range],['CRIT','+'+Math.round((d.crit||0)*100)+'%'],['BREAK',d.brk.name]];
      rows.forEach((r,i)=>{const big=i<6;text(r[0],124+(i%2)*90,66+Math.floor(i/2)*(i<6?14:9),'#8090c0',big?2:1);text(r[1],154+(i%2)*90,66+Math.floor(i/2)*(i<6?14:9),'#fff',big?2:1);});
      wrap(d.bio,66).forEach((l,i)=>text(l,124,132+i*8,'#c8d0f0',1));
      if(!this.inBattle){box(124,164,270,28);textC(G.lead===h.id?d.name.toUpperCase()+' IS LEADING ON THE MAP':'PRESS Z TO WALK AROUND AS '+d.name.toUpperCase(),259,170,G.lead===h.id?'#25a5a5':'#f9d83a',1);drawSprite(SPR[h.id+'_down']||SPR[d.spr],254,178,1);}
      text(this.msg,124,200,'#8be36a',1);text(this.inBattle?'< >: SWITCH   X: BACK':'< >: SWITCH BUDDY   Z: SET LEAD   X: BACK',124,226,'#8090c0',1);}
    else if(this.mode==='skills'){const h=heroes[this.hero];const d=HEROES[h.id];drawSprite(SPR[d.spr],124,6,2,true);text(d.name+"'S SKILLS",162,10,'#fff',2);let y=36;
      for(const id of d.skills){const s=SKILLS[id];const ok=s.lvl<=h.lvl;text((ok?s.name:'??? (LV '+s.lvl+')'),124,y,ok?'#fff':'#606880',2);textR(s.mp+'MP'+(s.range?' R'+s.range:s.radius?' A'+s.radius:'')+(s.crit?' CRIT+'+Math.round(s.crit*100)+'%':''),392,y,ok?'#7fb0f5':'#606880',1);if(ok)text(s.desc,124,y+10,'#c8d0f0',1);y+=17;}
      text('SKETCHES: '+d.draws.map(k=>DRAWS[k].name+' '+DRAWS[k].dp+'DP').join(', '),124,y+2,'#f9d83a',1);y+=10;text('BREAK: '+d.brk.name+' - '+d.brk.desc,124,y+2,'#25a5a5',1);text('< >: SWITCH BUDDY   X: BACK',124,226,'#8090c0',1);}
  }
}
class GameOverScene{
  constructor(){this.opaque=true;this.t=0;this.items=hasSave()?['Load last save','Title screen']:['Title screen'];this.menu=new Menu(this.items);}
  update(){this.t++;if(this.t<90)return;const r=this.menu.update();if(r==='ok'){AudioSys.sfx('confirm');const c=this.items[this.menu.i];if(c==='Load last save'){loadAndGo();}else{fadeOut(()=>Scene.replace(new TitleScene()));}}}
  draw(){rect(0,0,W,H,'#0a0a14');const a=Math.min(1,this.t/60);ctx.globalAlpha=a;textC('CAPTURED',W/2,70,'#d12a2a',5,'#3a0a0a');textC('The Sheriff wins this round. Level up, focus, and try again.',W/2,116,'#c8d0f0',1);if(this.t>=90){this.items.forEach((it,i)=>{const y=150+i*14;if(i===this.menu.i)text('}',150,y,'#f9d83a',2);text(it,162,y,'#fff',2);});}ctx.globalAlpha=1;}
}

    const off=H-this.t*0.5;this.lines.forEach((l,i)=>{const y=off+i*16;if(y<-10||y>H)return;textC(l,W/2,y,l===l.toUpperCase()&&l.length>2?'#f9d83a':'#fff',2);});
    ['robin_side','littlejohn_side','tuck_side','fred_side','marian_side','much_side','willscarlet_side','alan_side','donny_side','flurb_side'].forEach((s,i)=>{drawSprite(SPR[s],20+((this.t+i*44)/2)%460-40,200+Math.sin(this.t/8+i)*3,2,false);});}

// ===================== MAIN LOOP =====================
let lastT=0,acc=0;const STEP=1000/60;let errShown=null;
window.addEventListener('error',e=>{errShown=e.message;console.error(e.error||e.message);});
function mainLoop(ts){
  requestAnimationFrame(mainLoop);
  if(!lastT)lastT=ts;let dt=ts-lastT;lastT=ts;if(dt>100)dt=100;acc+=dt;
  let steps=0;
  while(acc>=STEP&&steps<4){
    if(Input.muteP()){AudioSys.toggle();}
    try{Scene.update();}catch(e){errShown=e.message;console.error(e);}
    updateFX();Input.flush();acc-=STEP;steps++;
  }
  ctx.save();if(FX.shake>0)ctx.translate(rint(-2,2),rint(-2,2));
  try{Scene.draw();}catch(e){errShown=e.message;console.error(e);}
  ctx.restore();
  drawFX();
  if(!AudioSys.on){text('MUTED',W-30,2,'#8090c0',1);}
  if(errShown){rect(0,0,W,12,'#800');text('ERR: '+errShown.slice(0,60),2,3,'#fff',1);}
}
Scene.replace(new TitleScene());
requestAnimationFrame(mainLoop);
